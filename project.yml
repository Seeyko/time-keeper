name: TimeKeeper

options:
  bundleIdPrefix: com.seeyko
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    # Ton Team ID Apple Developer (Xcode > Settings > Accounts). Laisser vide = à choisir dans Xcode.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Doit être unique sur ton compte Apple Developer. Change "seeyko" si besoin.
    BUNDLE_ID_ROOT: com.seeyko.timekeeper
    APP_GROUP_ID: group.com.seeyko.timekeeper
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  TimeKeeper:
    type: application
    platform: iOS
    sources: [App, Shared]
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Time Keeper
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/TimeKeeper.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT)
    dependencies:
      - target: TimeKeeperMonitor
      - target: TimeKeeperShieldConfig
      - target: TimeKeeperShieldAction

  # Compte le temps d'écran et pose le blocage quand la limite du jour est atteinte.
  TimeKeeperMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: TimeKeeperMonitor
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Monitor/TimeKeeperMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT).monitor

  # Écran affiché sur une app/un site bloqué : un seul bouton "Fermer", aucun déblocage.
  TimeKeeperShieldConfig:
    type: app-extension
    platform: iOS
    sources: [ShieldConfig]
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: TimeKeeperShieldConfig
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfig/TimeKeeperShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT).shieldconfig

  # Réaction aux boutons de l'écran de blocage : toujours "fermer".
  TimeKeeperShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction]
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: TimeKeeperShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldAction/TimeKeeperShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT).shieldaction
