name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projet Xcode à jour ?
        working-directory: ios
        run: |
          xcodegen generate --quiet
          git diff --quiet -- TimeKeeper.xcodeproj || echo "::warning::TimeKeeper.xcodeproj diffère de project.yml : lancer « xcodegen generate » et commiter."
      - name: Tests
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project TimeKeeper.xcodeproj -scheme TimeKeeper \
            -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO test

  testflight:
    name: TestFlight
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'Seeyko/time-keeper' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.TESTFLIGHT_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: XcodeGen
        run: brew install xcodegen
      - name: Clé App Store Connect
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Certificat et profils de distribution
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILES_TAR_BASE64: ${{ secrets.PROFILES_TAR_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signature.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/asc/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/profiles"
          echo "$PROFILES_TAR_BASE64" | base64 --decode | tar -xz -C "$RUNNER_TEMP/profiles"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP"/profiles/*.mobileprovision "$dir"/
          done
      - name: Archive
        working-directory: ios
        run: |
          xcodegen generate --quiet
          xcodebuild -project TimeKeeper.xcodeproj -scheme TimeKeeper \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TimeKeeper.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive
      - name: Envoi sur TestFlight
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TimeKeeper.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "- Build $BUILD_NUMBER envoyé sur TestFlight" >> "$GITHUB_STEP_SUMMARY"
      - name: Nettoyage
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/profiles"
