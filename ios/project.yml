name: TimeKeeper

options:
  bundleIdPrefix: com.seeyko
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    DEVELOPMENT_TEAM: 8564ATFAJQ
    CODE_SIGN_STYLE: Automatic
    BUNDLE_ID_ROOT: com.seeyko.timekeeper
    APP_GROUP_ID: group.com.seeyko.timekeeper
    LIVE_RELAY_URL: https://time-keeper-live.seeyko.workers.dev/push
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  TimeKeeper:
    type: application
    platform: iOS
    sources: [TimeKeeper, Shared]
    scheme:
      testTargets: [TimeKeeperTests]
    info:
      path: TimeKeeper/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Time Keeper
        AppGroupID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        LiveRelayURL: $(LIVE_RELAY_URL)
    entitlements:
      path: TimeKeeper/TimeKeeper.entitlements
      properties:
        aps-environment: production
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TimeKeeperMonitor
      - target: TimeKeeperShieldConfig
      - target: TimeKeeperShieldAction
      - target: TimeKeeperLive

  TimeKeeperMonitor:
    type: app-extension
    platform: iOS
    sources: [TimeKeeperMonitor, Shared]
    info:
      path: TimeKeeperMonitor/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: TimeKeeperMonitor
        AppGroupID: $(APP_GROUP_ID)
        LiveRelayURL: $(LIVE_RELAY_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: TimeKeeperMonitor/TimeKeeperMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT).monitor

  TimeKeeperShieldConfig:
    type: app-extension
    platform: iOS
    sources: [TimeKeeperShieldConfig]
    info:
      path: TimeKeeperShieldConfig/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: TimeKeeperShieldConfig
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: TimeKeeperShieldConfig/TimeKeeperShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT).shieldconfig

  TimeKeeperShieldAction:
    type: app-extension
    platform: iOS
    sources: [TimeKeeperShieldAction]
    info:
      path: TimeKeeperShieldAction/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: TimeKeeperShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: TimeKeeperShieldAction/TimeKeeperShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT).shieldaction

  TimeKeeperLive:
    type: app-extension
    platform: iOS
    sources: [TimeKeeperLive, Shared/LiveLimitAttributes.swift]
    info:
      path: TimeKeeperLive/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: TimeKeeperLive
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT).live

  TimeKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TimeKeeperTests]
    dependencies:
      - target: TimeKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_ROOT).tests
        GENERATE_INFOPLIST_FILE: YES
